name: Check yt-dlp Version

permissions:
  contents: write # needed to commit back requirements.txt
  issues: write
  actions: write # to trigger release workflow

on:
  schedule:
    # - cron: "0 0 * * *"
    - cron: "*/6 * * * *"
  workflow_dispatch:
  push:
    branches:
      - desktop

jobs:
  check-yt-dlp:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.compare.outputs.update_needed }}
      local_version: ${{ steps.local.outputs.local_version }}
      latest_version: ${{ steps.remote.outputs.latest_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get current yt-dlp version (robust encoding)
        id: local
        run: |
          python << 'EOF'
          import re, os
          version = "none"
          file_path = "requirements.txt"
          encodings = ['utf-8-sig', 'utf-16', 'utf-16le', 'utf-16be', 'latin-1']
          if os.path.exists(file_path):
              for enc in encodings:
                  try:
                      with open(file_path, "r", encoding=enc) as f:
                          for line in f:
                              line = line.strip()
                              m = re.match(r'^yt-dlp\s*(?:==|>=|<=)\s*([^\s;#]+)', line)
                              if m:
                                  version = m.group(1)
                                  break
                      if version != "none":
                          break
                  except:
                      continue
          print(f"Detected local: {version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"local_version={version}\n")
          EOF

      - name: Get latest yt-dlp version from PyPI
        id: remote
        run: |
          latest=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "latest_version=$latest" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          LOCAL="${{ steps.local.outputs.local_version }}"
          LATEST="${{ steps.remote.outputs.latest_version }}"
          if [ "$LOCAL" = "none" ] || [ "$LOCAL" = "$LATEST" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump yt-dlp in requirements.txt and commit
        if: steps.compare.outputs.update_needed == 'true'
        env:
          LATEST: ${{ steps.remote.outputs.latest_version }}
        run: |
          # Detect original encoding
          if file requirements.txt | grep -q "UTF-16"; then
            ENC="utf-16"
          else
            ENC="utf-8"
          fi
          python << EOF
          import re
          from pathlib import Path
          import os

          enc = "$ENC"
          latest = os.environ['LATEST']
          path = Path("requirements.txt")
          content = path.read_text(encoding=enc)
          lines = content.splitlines(keepends=True)
          new_lines = []
          replaced = False
          for line in lines:
              if re.match(r'^yt-dlp\s*(?:==|>=|<=)', line.strip()):
                  new_lines.append(f"yt-dlp=={latest}\n")
                  replaced = True
              else:
                  new_lines.append(line)
          if not replaced:
              new_lines.append(f"yt-dlp=={latest}\n")
          path.write_text("".join(new_lines), encoding=enc)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: bump yt-dlp to ${{ steps.remote.outputs.latest_version }}"
          git push origin HEAD:desktop   # ← changed line

      - name: Create issue when update available
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const local = "${{ steps.local.outputs.local_version }}";
            const latest = "${{ steps.remote.outputs.latest_version }}";
            const title = `yt-dlp update available: ${latest}`;
            const body = `## yt-dlp updated 🚀\n\n- **Old version:** \`${local}\`\n- **New version:** \`${latest}\`\n\nAuto‑triggering rebuild...`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-update,yt-dlp'
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                issue_number: existing.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ Still available. Rebuild triggered at ${new Date().toISOString()}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependency-update', 'yt-dlp']
              });
            }

      - name: Auto-trigger rebuild workflow
        if: steps.compare.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Rebuild and Release Seekbeat" \
            --ref desktop \
            --repo ${{ github.repository }} \
            -f bump_yt_dlp=false \
            -f auto_commit=false \
            -f close_issues=true
          echo "✅ Release workflow triggered"

      - name: Log no-update checks
        if: steps.compare.outputs.update_needed == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const logTitle = 'yt-dlp check log';
            const body = `## Check at ${new Date().toISOString()}\n- Local: \`${{ steps.local.outputs.local_version }}\`\n- Latest: \`${{ steps.remote.outputs.latest_version }}\`\n- Status: ✅ Up to date`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'yt-dlp-check-log', per_page: 100
            });
            let found = issues.find(i => i.title === logTitle);
            if (!found) {
              const created = await github.rest.issues.create({
                owner, repo, title: logTitle,
                body: 'Persistent log for yt-dlp version checks',
                labels: ['yt-dlp-check-log']
              });
              found = created.data;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: found.number, body
            });
