# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Check yt-dlp Version

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC
  workflow_dispatch:
  push:
    branches:
      - desktop

jobs:
  check-yt-dlp:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.compare.outputs.update_needed }}
      local_version: ${{ steps.local.outputs.local_version }}
      latest_version: ${{ steps.remote.outputs.latest_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get current yt-dlp version from requirements.txt
        id: local
        run: |
          if [ -f requirements.txt ]; then
            version=$(grep -E '^\s*yt-dlp\s*(==|>=|<=)' requirements.txt 2>/dev/null | head -n1 | sed -E 's/^[[:space:]]*yt-dlp(==|>=|<=)//')
            if [ -z "$version" ]; then
              version="none"
            fi
          else
            version="none"
          fi
          echo "local_version=$version" >> $GITHUB_OUTPUT

      - name: Get latest yt-dlp version from PyPI
        id: remote
        run: |
          latest=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "latest_version=$latest" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          LOCAL="${{ steps.local.outputs.local_version }}"
          LATEST="${{ steps.remote.outputs.latest_version }}"
          echo "Local:  $LOCAL"
          echo "Latest: $LATEST"
          if [ "$LOCAL" != "$LATEST" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "::warning::yt-dlp update available: $LOCAL → $LATEST"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "✅ yt-dlp is up to date."
          fi

      - name: Create or comment on issue when update available (avoid duplicate)
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'yt-dlp update available: ' + process.env.LATEST_VER;

            // fetch first 100 open issues
            const { data: issues } = await github.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });

            // find any open issue with the same title and expected labels
            const found = issues.find(i =>
              i.title === title &&
              i.labels.some(l => ['dependency-update','yt-dlp'].includes(l.name))
            );

            if (found) {
              await github.issues.createComment({
                owner, repo,
                issue_number: found.number,
                body: 'Checked again at ' + new Date().toISOString() + '. yt-dlp ' + process.env.LATEST_VER + ' still available.'
              });
              console.log('Found existing issue #' + found.number + ' — commented.');
            } else {
              const bodyLines = [
                'A new version of **yt-dlp** is available on PyPI.',
                '',
                '- Current in requirements.txt: **' + process.env.LOCAL_VER + '**',
                '- Latest on PyPI: **' + process.env.LATEST_VER + '**',
                '',
                'Trigger the manual Rebuild & Release workflow when you are ready.'
              ];
              await github.issues.create({
                owner, repo,
                title,
                body: bodyLines.join('\n'),
                labels: ['dependency-update','yt-dlp']
              });
              console.log('Created new issue for update ' + process.env.LATEST_VER);
            }
        env:
          LOCAL_VER: ${{ steps.local.outputs.local_version }}
          LATEST_VER: ${{ steps.remote.outputs.latest_version }}

      - name: Log "no update" by commenting on a persistent log issue
        if: steps.compare.outputs.update_needed == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const logTitle = 'yt-dlp check log';
            const body = 'No update needed at ' + new Date().toISOString() + '.\n- Local: ' + process.env.LOCAL_VER + '\n- Latest: ' + process.env.LATEST_VER;

            // find open issues labeled yt-dlp-check-log (first 100)
            const { data: issues } = await github.issues.listForRepo({
              owner, repo, state: 'open', labels: 'yt-dlp-check-log', per_page: 100
            });

            let found = issues.find(i => i.title === logTitle);
            if (!found) {
              const created = await github.issues.create({
                owner, repo,
                title: logTitle,
                body: 'This issue is used to collect yt-dlp nightly check comments. It is created by the workflow.',
                labels: ['yt-dlp-check-log']
              });
              found = created.data;
              console.log('Created persistent log issue #' + found.number);
            }

            await github.issues.createComment({
              owner, repo,
              issue_number: found.number,
              body
            });
        env:
          LOCAL_VER: ${{ steps.local.outputs.local_version }}
          LATEST_VER: ${{ steps.remote.outputs.latest_version }}
