name: Check yt-dlp Version

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - desktop

jobs:
  check-yt-dlp:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.compare.outputs.update_needed }}
      local_version: ${{ steps.local.outputs.local_version }}
      latest_version: ${{ steps.remote.outputs.latest_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get current yt-dlp version from requirements.txt (FIXED ENCODING)
        id: local
        run: |
          # Use Python with encoding detection
          python << 'EOF'
          import re
          import os

          version = "none"
          file_path = "requirements.txt"

          # Try different encodings
          encodings_to_try = ['utf-8-sig', 'utf-16', 'utf-16le', 'utf-16be', 'latin-1']

          if os.path.exists(file_path):
              for encoding in encodings_to_try:
                  try:
                      with open(file_path, "r", encoding=encoding) as f:
                          content = f.read()
                          # Look for yt-dlp line
                          for line in content.splitlines():
                              line = line.strip()
                              # Match yt-dlp==version or yt-dlp>=version or yt-dlp<=version
                              match = re.match(r'^yt-dlp\s*(?:==|>=|<=)\s*([^\s;#]+)', line)
                              if match:
                                  version = match.group(1)
                                  break
                          if version != "none":
                              break  # Found version, stop trying encodings
                  except (UnicodeDecodeError, UnicodeError):
                      continue  # Try next encoding

          print(f"Detected local yt-dlp version: {version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"local_version={version}\n")
          EOF

      - name: Debug - Show requirements.txt (with hex dump)
        run: |
          echo "=== File info ==="
          file requirements.txt || echo "file command not available"
          echo ""
          echo "=== First 100 bytes in hex ==="
          head -c 100 requirements.txt | xxd || echo "xxd not available"
          echo ""
          echo "=== Attempting to read with different encodings ==="
          python << 'EOF'
          import codecs
          encodings = ['utf-8-sig', 'utf-16', 'latin-1', 'cp1252']
          for enc in encodings:
              try:
                  with open('requirements.txt', 'r', encoding=enc) as f:
                      print(f"{enc}: {f.readline().strip()[:50]}")
              except:
                  print(f"{enc}: FAILED")
          EOF

      - name: Get latest yt-dlp version from PyPI
        id: remote
        run: |
          latest=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "latest_version=$latest" >> $GITHUB_OUTPUT
          echo "Latest PyPI version: $latest"

      - name: Compare versions
        id: compare
        run: |
          LOCAL="${{ steps.local.outputs.local_version }}"
          LATEST="${{ steps.remote.outputs.latest_version }}"

          echo "Local:  '$LOCAL'"
          echo "Latest: '$LATEST'"

          if [ "$LOCAL" = "none" ]; then
            echo "⚠️ yt-dlp not found in requirements.txt"
            echo "update_needed=false" >> $GITHUB_OUTPUT
          elif [ "$LOCAL" = "$LATEST" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "✅ yt-dlp is up to date ($LOCAL)"
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "::warning::yt-dlp update available: $LOCAL → $LATEST"
          fi

      - name: Create or comment on issue when update available
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'yt-dlp update available: ' + process.env.LATEST_VER;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });

            const found = issues.find(i => 
              i.title === title && 
              i.labels.some(l => ['dependency-update', 'yt-dlp'].includes(l.name))
            );

            if (found) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: found.number,
                body: '✅ Still available as of ' + new Date().toISOString() + '. Ready to rebuild?'
              });
              console.log('Commented on existing issue #' + found.number);
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: title,
                body: `## yt-dlp update available 🚀\n\n- **Current in requirements.txt:** \`${process.env.LOCAL_VER}\`\n- **Latest on PyPI:** \`${process.env.LATEST_VER}\`\n\nRun the "Rebuild and Release Seekbeat" workflow (with \`bump_yt_dlp=true\`) to update.`,
                labels: ['dependency-update', 'yt-dlp']
              });
              console.log('Created new issue');
            }
        env:
          LOCAL_VER: ${{ steps.local.outputs.local_version }}
          LATEST_VER: ${{ steps.remote.outputs.latest_version }}

      - name: Log no-update checks
        if: steps.compare.outputs.update_needed == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const logTitle = 'yt-dlp check log';
            const body = `## Check at ${new Date().toISOString()}\n- Local: \`${process.env.LOCAL_VER}\`\n- Latest: \`${process.env.LATEST_VER}\`\n- Status: ✅ Up to date`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'yt-dlp-check-log', per_page: 100
            });

            let found = issues.find(i => i.title === logTitle);
            if (!found) {
              const created = await github.rest.issues.create({
                owner, repo,
                title: logTitle,
                body: 'Persistent log for yt-dlp version checks',
                labels: ['yt-dlp-check-log']
              });
              found = created.data;
            }

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: found.number,
              body: body
            });
        env:
          LOCAL_VER: ${{ steps.local.outputs.local_version }}
          LATEST_VER: ${{ steps.remote.outputs.latest_version }}
