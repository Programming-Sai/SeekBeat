name: Cron Trigger for yt-dlp Check

on:
  schedule:
    - cron: "*/55 * * * *"
  workflow_dispatch:

permissions:
  actions: write # Allows triggering workflows
  contents: read # Needed to read the repo

jobs:
  trigger-check-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yt-dlp check workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Check yt-dlp Version workflow..."
          gh workflow run "Check yt-dlp Version" \
            --ref main \
            --repo ${{ github.repository }}
          echo "✅ Check workflow triggered successfully"
