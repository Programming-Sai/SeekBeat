name: Cron Trigger for yt-dlp Check

on:
  schedule:
    - cron: "*/55 * * * *" # midnight UTC
  workflow_dispatch: # manual trigger for testing

jobs:
  trigger-check-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger check workflow on desktop branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the command and capture the output URL
          RUN_URL=$(gh workflow run "Rebuild and Release Seekbeat" \
            --ref main \
            --repo ${{ github.repository }} \
            -f bump_yt_dlp=false \
            -f auto_commit=false \
            -f close_issues=true 2>&1 | grep -o 'https://github.com/[^ ]*')

          echo "✅ Release workflow triggered"
          echo "🔗 Run URL: ${RUN_URL}"
          echo "workflow_url=${RUN_URL}" >> $GITHUB_OUTPUT
