name: Cron Trigger for yt-dlp Check

on:
  schedule:
    - cron: "*/55 * * * *"
  workflow_dispatch:

jobs:
  trigger-check-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trigger the workflow and capture output
          echo "Triggering Rebuild and Release Seekbeat workflow..."

          # Run gh command and capture output, but don't exit on error
          set +e  # Temporarily disable exit on error
          OUTPUT=$(gh workflow run "Rebuild and Release Seekbeat" \
            --ref main \
            --repo ${{ github.repository }} \
            -f bump_yt_dlp=false \
            -f auto_commit=false \
            -f close_issues=true 2>&1)
          EXIT_CODE=$?
          set -e  # Re-enable exit on error

          # Print the output
          echo "$OUTPUT"

          # Extract URL if present (using grep that won't fail)
          RUN_URL=$(echo "$OUTPUT" | grep -o 'https://github\.com/[^[:space:]]*' | head -1 || true)

          if [ $EXIT_CODE -eq 0 ] && [ -n "$RUN_URL" ]; then
            echo "✅ Release workflow triggered successfully"
            echo "🔗 Run URL: ${RUN_URL}"
            echo "workflow_url=${RUN_URL}" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Release workflow triggered (URL not captured)"
          else
            echo "⚠️ Failed to trigger workflow (exit code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi
