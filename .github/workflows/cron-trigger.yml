name: Cron Trigger for yt-dlp Check

on:
  schedule:
    - cron: "*/55 * * * *"
  workflow_dispatch:

jobs:
  trigger-check-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yt-dlp check workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering yt-dlp check workflow..."

          # Trigger and capture output (including URL)
          OUTPUT=$(gh workflow run "Check yt-dlp Version" \
            --ref main \
            --repo ${{ github.repository }} 2>&1) || true

          echo "$OUTPUT"

          # Extract URL if present (won't fail if not found)
          RUN_URL=$(echo "$OUTPUT" | grep -o 'https://github\.com/[^[:space:]]*' | head -1 || echo "")

          if [ -n "$RUN_URL" ]; then
            echo "🔗 Check workflow URL: $RUN_URL"
            echo "workflow_url=$RUN_URL" >> $GITHUB_OUTPUT
          else
            echo "✅ Trigger sent (no URL captured)"
          fi
